# This is the production docker-compose and what powers TrackScape.app. Can also be used to host your own TrackScape instance.
# Note: production now runs on Postgres (and is moving to Railway); DATABASE_URL points at the postgres service.
services:
  postgres:
    image: postgres:17-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-trackscape}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-trackscape}'
    volumes:
      - trackscape-pg:/var/lib/postgresql/data
    networks:
      - trackscape-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-trackscape}" ]
      retries: 3
      timeout: 5s
  api:
    image: fatfingers23/trackscape-api:latest
    restart: always
    ports:
      - '80:8000'
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-trackscape}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trackscape}'
      DISCORD_TOKEN: '${DISCORD_TOKEN}'
      TRACKSCAPE_API_BASE: '${TRACKSCAPE_API_BASE}'
      REDIS_ADDR: '${REDIS_ADDR}'
      WOM_API_KEY: '${WOM_API_KEY}'
      MANAGEMENT_API_KEY: '${MANAGEMENT_API_KEY}'
    depends_on:
      - postgres
      - redis
    networks:
      - trackscape-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  bot:
    image: fatfingers23/trackscape-bot:latest
    restart: always
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-trackscape}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trackscape}'
      DISCORD_TOKEN: '${DISCORD_TOKEN}'
      TRACKSCAPE_API_BASE: '${TRACKSCAPE_API_BASE}'
      REDIS_ADDR: '${REDIS_ADDR}'
      WOM_API_KEY: '${WOM_API_KEY}'
      MANAGEMENT_API_KEY: '${MANAGEMENT_API_KEY}'
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - trackscape-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  worker:
    image: fatfingers23/trackscape-worker:latest
    restart: always
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-trackscape}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trackscape}'
      DISCORD_TOKEN: '${DISCORD_TOKEN}'
      TRACKSCAPE_API_BASE: '${TRACKSCAPE_API_BASE}'
      REDIS_ADDR: '${REDIS_ADDR}'
      WOM_API_KEY: '${WOM_API_KEY}'
    depends_on:
      - postgres
      - redis
    networks:
      - trackscape-network
    command: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
  cron-worker:
    image: fatfingers23/trackscape-cron-worker:latest
    restart: always
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-trackscape}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trackscape}'
      TRACKSCAPE_API_BASE: '${TRACKSCAPE_API_BASE}'
      REDIS_ADDR: '${REDIS_ADDR}'
      WOM_API_KEY: '${WOM_API_KEY}'
    depends_on:
      - postgres
      - redis
    networks:
      - trackscape-network
    command: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    image: 'redis:alpine'
    restart: always
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'trackscape-redis:/data'
    networks:
      - trackscape-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s
volumes:
  trackscape-pg:
    driver: local
  trackscape-redis:
    driver: local
networks:
  trackscape-network:
    driver: bridge
