[package]
name = "trackscape-discord-migrator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# One-off binary that copies the legacy MongoDB database into Postgres.
# Run it with MONGO_DB_URL (the old database) and DATABASE_URL (the new one).

[dependencies]
trackscape-discord-shared = { path = "../trackscape-discord-shared", features = [
    "legacy-mongo",
] }
mongodb = "2.4.0"
bson = { version = "2.10.0", features = ["chrono-0_4"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
] }
tokio = { version = "1.26.0", features = ["full"] }
anyhow = "1.0.75"
chrono = { version = "0.4.33", features = ["serde"] }
uuid = { version = "1.4.1", features = ["v4", "v5", "serde"] }
serde_json = "1.0.105"
log = "0.4.20"
env_logger = "0.10"
dotenv = "0.15.0"
futures = "0.3.28"

[dev-dependencies]
