services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-trackscape}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-trackscape}'
      POSTGRES_DB: '${POSTGRES_DB:-trackscape}'
    volumes:
      - trackscape-pg:/var/lib/postgresql/data
    networks:
      - trackscape-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-trackscape}" ]
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'trackscape-redis:/data'
    networks:
      - trackscape-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      retries: 3
      timeout: 5s
volumes:
  trackscape-pg:
    driver: local
  trackscape-redis:
    driver: local
networks:
  trackscape-network:
    driver: bridge
